name: Generate Cyber-Spider Contribution Grid Crawler

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Cyber-Spider contribution grid animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile-spider-contrib/spider-grid-dark.svg?palette=github-dark&color_snake=#00f2fe&color_dots=#161b22,#003b46,#07575b,#00f2fe,#a855f7
            profile-spider-contrib/spider-grid-light.svg?palette=github-light&color_snake=#0077b5&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & Push Cyber-Spider animations
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-spider-contrib/
          git commit -m "chore: update cyber-spider contribution grid [skip ci]" || exit 0
          git push
