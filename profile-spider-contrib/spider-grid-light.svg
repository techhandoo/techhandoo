<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="880" height="180">
  <style>
    .bg { fill: #ffffff; rx: 8px; stroke: #d0d7de; stroke-width: 1; }
    .dot-0 { fill: #ebedf0; }
    .dot-1 { fill: #9be9a8; }
    .dot-2 { fill: #40c463; }
    .dot-3 { fill: #30a14e; }
    .dot-4 { fill: #216e39; }
    .label { font-family: 'Fira Code', -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; font-size: 11px; fill: #57606a; }
    .spider-silk { stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 4, 4; fill: none; opacity: 0.6; }
    @keyframes crawl {
      0% { transform: translate(60px, 45px); }
      20% { transform: translate(220px, 95px); }
      40% { transform: translate(450px, 35px); }
      60% { transform: translate(620px, 115px); }
      80% { transform: translate(780px, 55px); }
      100% { transform: translate(60px, 45px); }
    }
    .spider-sprite {
      animation: crawl 14s infinite ease-in-out;
      font-size: 18px;
    }
  </style>

  <rect width="880" height="180" class="bg"/>

  <!-- Contribution Grid Header -->
  <text x="35" y="28" class="label" fill="#0969da" font-weight="bold">🕷️ CYBER-SPIDER COMMIT CRAWLER // LIVE GRID TRAVERSAL</text>

  <!-- Contribution dots background simulation (53 columns x 7 rows) -->
  <g transform="translate(35, 42)">
    <defs>
      <pattern id="grid-pattern-light" width="15" height="15" patternUnits="userSpaceOnUse">
        <rect x="0" y="0" width="11" height="11" rx="2" class="dot-0"/>
      </pattern>
    </defs>
    <rect width="810" height="105" fill="url(#grid-pattern-light)"/>

    <!-- Active Commit Highlights -->
    <rect x="30" y="15" width="11" height="11" rx="2" class="dot-1"/>
    <rect x="45" y="30" width="11" height="11" rx="2" class="dot-2"/>
    <rect x="60" y="45" width="11" height="11" rx="2" class="dot-3"/>
    <rect x="75" y="15" width="11" height="11" rx="2" class="dot-1"/>
    <rect x="90" y="60" width="11" height="11" rx="2" class="dot-2"/>
    <rect x="120" y="30" width="11" height="11" rx="2" class="dot-3"/>
    <rect x="135" y="45" width="11" height="11" rx="2" class="dot-4"/>
    <rect x="150" y="15" width="11" height="11" rx="2" class="dot-2"/>
    <rect x="165" y="75" width="11" height="11" rx="2" class="dot-1"/>
    <rect x="195" y="45" width="11" height="11" rx="2" class="dot-3"/>
    <rect x="210" y="60" width="11" height="11" rx="2" class="dot-4"/>
    <rect x="240" y="15" width="11" height="11" rx="2" class="dot-2"/>
    <rect x="255" y="30" width="11" height="11" rx="2" class="dot-3"/>
    <rect x="270" y="45" width="11" height="11" rx="2" class="dot-1"/>
    <rect x="300" y="60" width="11" height="11" rx="2" class="dot-4"/>
    <rect x="330" y="30" width="11" height="11" rx="2" class="dot-2"/>
    <rect x="345" y="45" width="11" height="11" rx="2" class="dot-3"/>
    <rect x="375" y="15" width="11" height="11" rx="2" class="dot-1"/>
    <rect x="405" y="60" width="11" height="11" rx="2" class="dot-3"/>
    <rect x="420" y="45" width="11" height="11" rx="2" class="dot-4"/>
    <rect x="450" y="15" width="11" height="11" rx="2" class="dot-3"/>
    <rect x="450" y="30" width="11" height="11" rx="2" class="dot-4"/>
    <rect x="465" y="45" width="11" height="11" rx="2" class="dot-4"/>
    <rect x="480" y="15" width="11" height="11" rx="2" class="dot-3"/>
    <rect x="495" y="30" width="11" height="11" rx="2" class="dot-4"/>
    <rect x="510" y="45" width="11" height="11" rx="2" class="dot-3"/>
    <rect x="525" y="60" width="11" height="11" rx="2" class="dot-4"/>
    <rect x="540" y="15" width="11" height="11" rx="2" class="dot-3"/>
    <rect x="555" y="45" width="11" height="11" rx="2" class="dot-4"/>
    <rect x="585" y="30" width="11" height="11" rx="2" class="dot-3"/>
    <rect x="615" y="60" width="11" height="11" rx="2" class="dot-4"/>
    <rect x="630" y="15" width="11" height="11" rx="2" class="dot-3"/>
    <rect x="660" y="45" width="11" height="11" rx="2" class="dot-4"/>
    <rect x="690" y="30" width="11" height="11" rx="2" class="dot-3"/>
    <rect x="720" y="15" width="11" height="11" rx="2" class="dot-4"/>
    <rect x="750" y="45" width="11" height="11" rx="2" class="dot-3"/>
    <rect x="765" y="60" width="11" height="11" rx="2" class="dot-4"/>
    <rect x="780" y="30" width="11" height="11" rx="2" class="dot-4"/>
    <rect x="795" y="15" width="11" height="11" rx="2" class="dot-3"/>

    <!-- Animated Silk Path -->
    <path d="M 60,45 Q 200,100 450,35 T 780,55" class="spider-silk"/>

    <!-- Crawling Spider Sprite -->
    <g class="spider-sprite">
      <text x="-9" y="6">🕷️</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(680, 160)">
    <text x="-35" y="9" class="label">Less</text>
    <rect x="0" y="0" width="10" height="10" rx="2" class="dot-0"/>
    <rect x="15" y="0" width="10" height="10" rx="2" class="dot-1"/>
    <rect x="30" y="0" width="10" height="10" rx="2" class="dot-2"/>
    <rect x="45" y="0" width="10" height="10" rx="2" class="dot-3"/>
    <rect x="60" y="0" width="10" height="10" rx="2" class="dot-4"/>
    <text x="76" y="9" class="label">More</text>
  </g>
</svg>
